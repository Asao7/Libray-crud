<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MineBooks — Login</title>
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>

  <div class="container">

    <div class="logo">
      <span class="logo-icon">📚</span>
      <h1>MineBooks</h1>
      <p class="logo-sub">Tu biblioteca personal</p>
    </div>

    <div class="input-group">
      <span class="input-icon">✉️</span>
      <input id="email" type="email" placeholder="Correo electrónico">
    </div>

    <div class="input-group">
      <span class="input-icon">🔒</span>
      <input id="password" type="password" placeholder="Contraseña">
    </div>

    <button onclick="login()">Entrar</button>

    <p>
      ¿No tienes cuenta?
      <a href="/html/register.html">Regístrate aquí</a>
    </p>

  </div>

  <script>
    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("Completa todos los campos");
        return;
      }

      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.mensaje || "Error de login");
          return;
        }

        if (data.token) {
          localStorage.setItem("token", data.token);
          window.location.href = "/html/biblioteca.html";
        } else {
          alert("No se recibió token del servidor");
        }

      } catch (error) {
        console.log(error);
        alert("Error de conexión con el servidor");
      }
    }

    // Enter para hacer login
    document.addEventListener("keydown", e => {
      if (e.key === "Enter") login();
    });
  </script>

</body>
</html>
