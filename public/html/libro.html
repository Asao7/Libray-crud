<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Libro</title>
  <link rel="stylesheet" href="/css/libro.css">
</head>
<body>

  <button class="btn-volver" onclick="volver()">← Volver</button>

  <div class="container">

    <!-- PORTADA -->
    <div class="book-hero" id="bookHero">
      <div class="book-hero-icon">📖</div>
    </div>

    <!-- INFO -->
    <div class="book-info">
      <h1 id="tituloLibro"></h1>
      <p class="autor" id="autorLibro"></p>

      <div class="meta-row">
        <span class="estado-badge" id="estadoLibro"></span>
        <div class="stars" id="starsLibro"></div>
      </div>

      <p class="descripcion" id="descripcionLibro"></p>
    </div>

    <hr class="divider">

    <!-- RESEÑAS -->
    <div class="resenas-section">
      <h2>📝 Reseñas</h2>

      <div class="resena-form">
        <textarea id="reseñaInput" placeholder="Escribe tu reseña..."></textarea>
        <button onclick="agregarResena()">Publicar reseña</button>
      </div>

      <div id="listaReseñas"></div>
    </div>

  </div>

  <script src="/js/libro.js"></script>
</body>
</html>
